name: Excercice CI/CD 

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  APP_NAME: "MonApp"
  ENVIRONMENT: "development"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build
        run: echo "Construction de $APP_NAME est OK..."

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Test
        run: echo "Exécution de $APP_NAME dans $ENVIRONMENT est OK..."

  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Deploy
        run: echo "Déploiement de $APP_NAME dans $ENVIRONMENT est OK..."
