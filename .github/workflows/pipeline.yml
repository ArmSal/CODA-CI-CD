name: Excercice CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  APP_NAME: "MonApp"
  ENVIRONMENT: "development"

jobs:
  build_app:
    runs-on: ubuntu-latest
    steps:
      - name: Before script
        run: echo "before_script"
      - name: Build app
        run: echo "Construction application"
      - name: After script
        if: always()
        run: echo "after_script"

  build_docs:
    runs-on: ubuntu-latest
    steps:
      - name: Before script
        run: echo "before_script"
      - name: Build docs
        run: echo "Construction documentation"
      - name: After script
        if: always()
        run: echo "after_script"

  test:
    runs-on: ubuntu-latest
    needs: [build_app, build_docs]
    steps:
      - name: Before script
        run: echo "before_script"
      - name: Test
        run: echo "Exécution de $APP_NAME dans $ENVIRONMENT est OK..."
      - name: After script
        if: always()
        run: echo "after_script"

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref_name == 'main' && !startsWith(github.ref_name, 'feature/')
    steps:
      - name: Before script
        run: echo "before_script"
      - name: Deploy
        run: echo "Déploiement de $APP_NAME dans $ENVIRONMENT est OK..."
      - name: After script
        if: always()
        run: echo "after_script"

  deploy_staging:
    runs-on: ubuntu-latest
    needs: test
    environment:
      name: staging
      url: https://staging.example.com
    steps:
      - name: Before script
        run: echo "before_script"
      - name: Deploy staging
        run: echo "Déploiement de $APP_NAME en staging est OK..."
      - name: After script
        if: always()
        run: echo "after_script"
